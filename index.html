    let solution = muscles[Math.floor(Math.random() * muscles.length)];

    function checkAnswer() {
      const input = document.getElementById("answer").value.toLowerCase();
      const proposition = muscles.find(m => m.nom.toLowerCase() === input);

      if (!proposition) {
        alert("Muscle non reconnu dans la base de données.");
        return;
      }

      compareField("origine", proposition.origine, solution.origine);
      compareField("terminaison", proposition.terminaison, solution.terminaison);
      compareField("fonction-principale", proposition.fonctionPrincipale, solution.fonctionPrincipale);
      compareField("innervation", proposition.innervation, solution.innervation);
      compareField("region", proposition.region, solution.region);
    }

    function compareField(fieldId, value, correctValue) {
      const cell = document.getElementById(fieldId);
      cell.textContent = value;

      if (value === correctValue) {
        cell.className = "correct";
      } else if (value.split(" ").some(word => correctValue.includes(word))) {
        cell.className = "partial";
      } else {
        cell.className = "incorrect";
      }
